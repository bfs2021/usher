name: Question
description: Ask for help with setting up or using Usher
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please don't post passwords, API keys, tokens, session cookies, push keys, your server's address or anything else that identifies you or your home. Black them out first. A security problem does not belong in a public issue.
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: happens
    attributes:
      label: What happens instead
      description: What you saw, and where in the app, and what you already tried.
    validations:
      required: true
  - type: input
    id: usher_version
    attributes:
      label: Usher version
      description: Settings → About shows it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From Status → Logs, with anything secret removed.
      render: text
